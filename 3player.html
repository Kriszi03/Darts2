<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  
    <title>HTML</title>
    
    
    
  
    <!-- Custom Styles -->
    <link rel="stylesheet" href="3player.css">
  </head>
  
  <body>
    <div id="game">
    <p id="winner"></p>
    <img src="cup.png" id="cup">
    <div class="missX">X</div>
    
    <div id="respopB">
    <div class="resPop" id="resPop">
      <h2 id="poptext">Játék Vége!</h2>
      <div class="popUp2">
        
       <button class="restar" id="restar" onclick="resGame()">Restart
    </button>
    <button class="mainMenu" id="mainMenu" onclick="menu()">Main Menu</button>
      </div>
    </div>
  </div>
    
    <div class="throws">
    <span id="throw1">-</span>
    <span id="throw2">-</span>
    <span id="throw3"> -</span>
    </div>
    <div class="scoreboard" id="scoreboard">
      <div class="p1-container">
      <label for="p1-scores" id="p1-name"></label>
      <div class="scores p1-scores" id="p1-scores">---</div>
      </div>
      <div class="scores p2-scores" id="p2-scores">---</div>
      <div class="scores p3-scores" id="p3-scores">---</div>
    </div>
    
    <div class="display" id="display">
      <div class="turns-lbl" id="turns-lbl">Dobások</div>
      <div class=" turns-left" id="turns-left"></div>
      <div class="current-lbl" id="current-lbl">Játékos</div>
      <div class=" current-player" id="current-player">0</div>
    </div>
    
    <button id="screen" onclick="fullScreen()">[ ]</button>

    <div id="playerPopUp" class="popup">
      <div class="popup-box">
        <h2>Enter Name</h2>
          <input id="player1" placeholder="Player 1 name">
          <input id="player2" placeholder="Player 2 name">
          <input id="player3" placeholder="Player 3 name">
          <button onclick="closePopUp()">Continue</button>
        </div>
      </div>
    
   
    <button class="buttons miss" id="miss" onclick="miss()">
      <span class="missfront">Miss</span>
    </button>
  
     <button class="buttons undo" id="undo" onclick="undoThrow()">
       <span class="undofront">Undo</span>
       </button>
  
    <button class="buttons p-next" onclick="nextPlayer()">
      <span class="p-nextfront">Next player</span></button>
  
       <div class="score-btns" id="score-btns">
   
      <button class="scrbtn btn20" id="btn20" onclick="addScore(20)">
      </button>
      <button class="scrbtn btn1" id="btn1" onclick="addScore(1)"></button>
      <button class="scrbtn btn18" id="btn18" onclick="addScore(18)"></button>
      <button class="scrbtn btn4" id="btn4" onclick="addScore(4)"></button>
      <button class="scrbtn btn13" id="btn13" onclick="addScore(13)"></button>
      <button class="scrbtn btn6" id="btn6" onclick="addScore(6)"></button>
      <button class="scrbtn btn10" id="btn10" onclick="addScore(10)"></button>
      <button class="scrbtn btn15" id="btn15" onclick="addScore(15)"></button>
      <button class="scrbtn btn2" id="btn2" onclick="addScore(2)"></button>
      <button class="scrbtn btn17" id="btn17" onclick="addScore(17)"></button>
      <button class="scrbtn btn3" id="btn3" onclick="addScore(3)"></button>
    <button class="scrbtn btn19" id="19" onclick="addScore(19)"></button>
    <button class="scrbtn btn7" id="btn7" onclick="addScore(7)"></button>
    <button class="scrbtn btn16" id="btn16" onclick="addScore(16)"></button>
    <button class="scrbtn btn8" id="btn8" onclick="addScore(8)"></button>
    <button class="scrbtn btn11" id="btn11" onclick="addScore(11)"></button>
    <button class="scrbtn btn14" id="btn14" onclick="addScore(14)"></button>
     <button class="scrbtn btn9" id="btn9" onclick="addScore(9)"></button>
      <button class="scrbtn btn12" id="12" onclick="addScore(12)"></button>
       <button class="scrbtn btn5" id="btn5" onclick="addScore(5)"></button>
       </div>
    <div>
    <button class="circle-green" onclick="addScore(25)"></button>
    <button class="bull"
    onclick="addScore(50)"></button>
     </div>
     
     
    <div class="xx" id="xx">
      
    <button class="x2R x-20" onclick="addScore(40)"></button>
    <button class="x2G x-1" onclick=addScore(2)></button>
    <button class="x2R x-18"onclick="addScore(36)"></button>
    <button class="x2G x-4" onclick="addScore(8)"></button>
    <button class="x2R x-13" onclick="addScore(26)"></button>

  </div>
